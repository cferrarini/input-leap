name: Windows Qt5 Build (OpenSSL 1.1.1 - Windows 7/8 Compatible)

on:
  workflow_dispatch:

env:
  B_BUILD_TYPE: Release

jobs:
  win-build:
    name: Windows Qt5 (x64)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          path: input-leap
          submodules: recursive

      - name: Download Bonjour SDK-like
        id: bonjour
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -Force -ItemType Directory -Path .\deps | Out-Null

          Invoke-WebRequest `
            'https://github.com/nelsonjchen/mDNSResponder/releases/download/v2019.05.08.1/x64_RelWithDebInfo.zip' `
            -OutFile 'deps\BonjourSDKLike.zip'

          Expand-Archive .\deps\BonjourSDKLike.zip -DestinationPath .\deps\BonjourSDKLike -Force
          Remove-Item deps\BonjourSDKLike.zip

          "path=$env:GITHUB_WORKSPACE\deps\BonjourSDKLike" >> $env:GITHUB_OUTPUT

      - name: Extract OpenSSL 1.1.1
        id: openssl
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zip  = Join-Path $env:GITHUB_WORKSPACE "input-leap\deps\openssl-1.1.1w.zip"
          $dest = Join-Path $env:GITHUB_WORKSPACE "deps\openssl-extracted"

          if (-not (Test-Path $zip)) {
            Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "input-leap\deps") -ErrorAction SilentlyContinue
            throw "OpenSSL ZIP not found: $zip"
          }
          Write-Host ("Tamanho do zip: {0} bytes" -f (Get-Item $zip).Length)

          New-Item -Force -ItemType Directory -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force

          $x64 = Get-ChildItem -Path $dest -Recurse -Directory -Filter x64 |
                 Where-Object { Test-Path (Join-Path $_.FullName "lib\libssl.lib") } |
                 Select-Object -First 1
          if (-not $x64) { throw "OpenSSL x64 libraries not found under: $dest" }

          $p = $x64.FullName
          foreach ($f in "bin\libssl-1_1-x64.dll","bin\libcrypto-1_1-x64.dll",
                         "lib\libssl.lib","lib\libcrypto.lib","include\openssl\ssl.h") {
            if (-not (Test-Path (Join-Path $p $f))) { throw "Faltando em ${p}: $f" }
          }

          Write-Host "OpenSSL path: $p"
          "path=$p" >> $env:GITHUB_OUTPUT

      - name: Patch OpenSSL 1.1 API
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $src  = Join-Path $env:GITHUB_WORKSPACE "input-leap\src"
          $utf8 = New-Object System.Text.UTF8Encoding($false)

          function Edit-File($path, [scriptblock]$fn) {
            $old = [IO.File]::ReadAllText($path)
            $new = & $fn $old
            if ($new -ne $old) {
              [IO.File]::WriteAllText($path, $new, $utf8)
              Write-Host "patched: $path"
            }
          }

          # 1) Renomeia a API legada (1.0.x) para a 1.1, em todo o código-fonte.
          #    O zip foi compilado com --api=1.1.0 (OPENSSL_MIN_API), então os
          #    nomes antigos nunca são declarados nos headers.
          $init_ssl = 'OPENSSL_init_ssl(OPENSSL_INIT_LOAD_SSL_STRINGS | OPENSSL_INIT_LOAD_CRYPTO_STRINGS, nullptr)'
          $init_cry = 'OPENSSL_init_crypto(OPENSSL_INIT_ADD_ALL_CIPHERS | OPENSSL_INIT_ADD_ALL_DIGESTS, nullptr)'

          Get-ChildItem $src -Recurse -Include *.cpp,*.h | ForEach-Object {
            Edit-File $_.FullName {
              param($t)
              $t = $t -replace '\bSSL_library_init\s*\(\s*\)',            $init_ssl
              $t = $t -replace '\bSSL_load_error_strings\s*\(\s*\)',      $init_ssl
              $t = $t -replace '\bOpenSSL_add_all_algorithms\s*\(\s*\)',  $init_cry
              $t = $t -replace '\bX509_get_notBefore\b', 'X509_getm_notBefore'
              $t = $t -replace '\bX509_get_notAfter\b',  'X509_getm_notAfter'
              $t = $t -replace '\bSSLeay_version\b',     'OpenSSL_version'
              $t = $t -replace '\bSSLEAY_VERSION\b',     'OPENSSL_VERSION'
              $t = $t -replace '\bSSLEAY_CFLAGS\b',      'OPENSSL_CFLAGS'
              $t = $t -replace '\bSSLEAY_BUILT_ON\b',    'OPENSSL_BUILT_ON'
              $t = $t -replace '\bSSLEAY_PLATFORM\b',    'OPENSSL_PLATFORM'
              $t = $t -replace '\bSSLEAY_DIR\b',         'OPENSSL_DIR'
              $t
            }
          }

          # 2) Includes que antes vinham "de carona" pela API antiga.
          $inc = @{
            "lib\net\SecureUtils.cpp"  = @('openssl/bn.h','openssl/rsa.h','openssl/x509.h','openssl/evp.h','openssl/crypto.h','openssl/ssl.h')
            "lib\net\SecureSocket.cpp" = @('openssl/crypto.h','openssl/ssl.h','openssl/err.h','openssl/evp.h')
          }
          foreach ($rel in $inc.Keys) {
            $file = Join-Path $src $rel
            if (-not (Test-Path $file)) { Write-Warning "não encontrado: $file"; continue }
            Edit-File $file {
              param($t)
              $add = ($inc[$rel] | ForEach-Object { "#include <$_>" }) -join "`r`n"
              "$add`r`n$t"
            }
          }

          # 3) Verificação: símbolos legados que ainda sobraram
          $left = Get-ChildItem $src -Recurse -Include *.cpp,*.h |
                  Select-String -Pattern '\bSSLeay_version\b|\bSSLEAY_\w+|\bSSL_library_init\b|\bX509_get_not(Before|After)\b'
          if ($left) { Write-Warning "Sobraram símbolos legados:"; $left | Select-Object -First 20 | ForEach-Object { $_.ToString() } }

      - name: Patch OPENSSL_DIR
        shell: powershell
        run: |
          $f = Join-Path $env:GITHUB_WORKSPACE "input-leap\src\lib\net\SecureSocket.cpp"
          Write-Host "--- linhas 836-846 antes ---"
          Get-Content $f | Select-Object -Skip 835 -First 11
          $t = [IO.File]::ReadAllText($f)
          $n = $t -replace 'OpenSSL_version\(\s*(OPENSSL_DIR|SSLEAY_DIR)\s*\)', 'OpenSSL_version(4)'
          if ($n -ne $t) {
            [IO.File]::WriteAllText($f, $n, (New-Object System.Text.UTF8Encoding($false)))
            Write-Host "patched OPENSSL_DIR -> 4"
          } else {
            Write-Host "regex não casou; veja as linhas acima"
          }


      - name: Patch ServerProxy (m_fileTransferActive)
        shell: powershell
        run: |
          # PALIATIVO: o .cpp usa o membro e o .h não o declara. Corrija no repositório
          # e remova este passo. Aqui só declara o membro se estiver faltando.
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:GITHUB_WORKSPACE "input-leap\src\lib\client"
          $h   = Join-Path $dir "ServerProxy.h"
          $cpp = Join-Path $dir "ServerProxy.cpp"

          $inCpp = Select-String -Path $cpp -Pattern 'm_fileTransferActive' -Quiet
          $inH   = Select-String -Path $h   -Pattern 'm_fileTransferActive' -Quiet
          if ($inCpp -and -not $inH) {
            Select-String -Path $cpp -Pattern 'm_fileTransferActive' | Select-Object -First 6 | ForEach-Object { $_.ToString() }
            $t = [IO.File]::ReadAllText($h)
            $m = [regex]::Match($t, '(?m)^[ \t]*private:[ \t]*\r?\n')
            if (-not $m.Success) { throw "Sem seção 'private:' em ServerProxy.h; declare o membro à mão." }
            $t = $t.Insert($m.Index + $m.Length, "`tbool m_fileTransferActive = false;`r`n")
            [IO.File]::WriteAllText($h, $t, (New-Object System.Text.UTF8Encoding($false)))
            Write-Host "Declarado m_fileTransferActive em ServerProxy.h"
          } else {
            Write-Host "Nada a fazer (cpp usa: $inCpp, h declara: $inH)"
          }

      - name: Install Qt5
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          cache: true

      - name: Configure build
        shell: powershell
        run: |
          New-Item -Force -ItemType Directory -Path build | Out-Null
          cd build

          cmake -S ..\input-leap `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -D CMAKE_BUILD_TYPE=Release `
            -D QT_DEFAULT_MAJOR_VERSION=5 `
            -D INPUTLEAP_VERSION_DESC=release `
            -D INPUTLEAP_BUILD_GULRAK_FILESYSTEM=1 `
            -D DNSSD_LIB="$env:BONJOUR_SDK_HOME\Lib\x64\dnssd.lib" `
            -D OPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" `
            -D OPENSSL_INCLUDE_DIR="$env:OPENSSL_ROOT_DIR\include" `
            -D OPENSSL_CRYPTO_LIBRARY="$env:OPENSSL_ROOT_DIR\lib\libcrypto.lib" `
            -D OPENSSL_SSL_LIBRARY="$env:OPENSSL_ROOT_DIR\lib\libssl.lib" `
            -D CMAKE_INSTALL_PREFIX=input-leap-install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          BONJOUR_SDK_HOME: ${{ steps.bonjour.outputs.path }}
          OPENSSL_ROOT_DIR: ${{ steps.openssl.outputs.path }}

      - name: Build
        shell: powershell
        run: |
          cmake --build build --config Release --target install -- /m /nologo /v:minimal 2>&1 |
            Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "=============== ERROS ==============="
            Select-String -Path build.log -Pattern ' error |fatal error|LNK\d+' |
              ForEach-Object { $_.Line.Trim() } | Select-Object -Unique -First 40
            exit $code
          }

      - name: Copy OpenSSL DLLs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $p = "${{ steps.openssl.outputs.path }}"
          $d = "build\input-leap-install"
          Copy-Item "$p\bin\libssl-1_1-x64.dll"    -Destination $d -Force
          Copy-Item "$p\bin\libcrypto-1_1-x64.dll" -Destination $d -Force

      - name: Create ZIP
        shell: powershell
        run: |
          Compress-Archive -Path build\input-leap-install\* `
            -DestinationPath input-leap-windows-qt5-openssl111-x64.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: input-leap-windows-qt5-openssl111-x64
          path: input-leap-windows-qt5-openssl111-x64.zip
          retention-days: 30
